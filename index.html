<title>卡美特团队看板</title>
<style>
:root{color-scheme:light;--page:#f3f4f8;--surface:#fff;--ink:#12172b;--ink2:#4b5266;--border:#e7e9f0;--accent:#1d3bb3;--sun:#f6e45a;--bad:#c8322b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0e1118;--surface:#171b25;--ink:#eceef5;--ink2:#b8bfd0;--border:#262c3a;--accent:#7d9bff;--bad:#ff8079}}
*{box-sizing:border-box}
body{margin:0;min-height:90vh;display:grid;place-items:center;padding:16px;background:var(--page);color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.badge{display:inline-block;background:var(--sun);color:#111;font-weight:700;border-radius:8px 8px 8px 2px;padding:1px 10px;margin-bottom:10px}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--ink2);font-size:13px;margin:0 0 16px}
input,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px}
input{border:1px solid var(--border);background:var(--page);color:var(--ink);margin-bottom:10px}
button{border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const btn = document.getElementById("go"), err = document.getElementById("err"), inp = document.getElementById("pw");
async function open_(pw, silent) {
  btn.disabled = true; btn.textContent = "打开中…"; err.textContent = "";
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("nocrypto");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.i)}, key, b64(P.c)));
    try { localStorage.setItem(KEY, pw); } catch (e) {}
    // 用解密出的看板替换当前页面：换样式、换正文，再逐个运行看板脚本
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.querySelectorAll("style").forEach(s => s.remove());
    doc.querySelectorAll("style").forEach(s => document.head.appendChild(document.importNode(s, true)));
    const scripts = [...doc.body.querySelectorAll("script")].map(s => s.textContent);
    doc.body.querySelectorAll("script").forEach(s => s.remove());
    document.body.innerHTML = doc.body.innerHTML;
    for (const code of scripts) { const el = document.createElement("script"); el.textContent = code; document.body.appendChild(el); }
  } catch (x) {
    if (silent) { try { localStorage.removeItem(KEY); } catch (e) {} }
    err.textContent = x.message === "nocrypto" ? "这个浏览器打不开，请换系统浏览器或更新企业微信" : (silent ? "密码换过了，请重新输入" : "密码不对，请再试一次");
    btn.disabled = false; btn.textContent = "打开";
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); open_(inp.value.trim(), false); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) open_(saved, true); else inp.focus();
